name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test:run

      - name: Auto-bump patch version
        id: bump
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          VERSION=$(jq -r '.version | split(".") | .[2] |= (tonumber + 1 | tostring) | join(".")' packages/cli/package.json)
          jq ".version = \"$VERSION\"" packages/cli/package.json > /tmp/pkg.json
          mv /tmp/pkg.json packages/cli/package.json
          git add packages/cli/package.json
          git commit -m "chore: bump to v$VERSION [skip ci]"
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git Tag
        run: |
          git tag ${{ steps.bump.outputs.version }}
          git push origin ${{ steps.bump.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.event.head_commit.message, 'feat') || startsWith(github.event.head_commit.message, 'fix')
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
